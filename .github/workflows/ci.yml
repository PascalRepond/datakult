name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/theme/static_src/package-lock.json


      - name: Install Python dependencies
        run: uv sync --frozen --dev --no-group prod

      # Compiling the translations needs msgfmt
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Install Node.js dependencies
        run: npm ci
        working-directory: src/theme/static_src

      - name: Run CI checks
        run: uv run poe ci

  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen --dev --no-group prod

      - name: Validate release configuration
        run: |
          echo "📋 Checking what release would be created..."
          echo ""

          # Run in noop mode to see what would happen without making changes
          uv run semantic-release --noop version || {
            echo "ℹ️  No release would be created (no releasable commits since last release)"
            exit 0
          }

          echo ""
          echo "✅ Release configuration is valid!"
