{% load static tailwind_tags %}
{% load django_htmx %}
<meta charset="UTF-8" />
<meta name="description"
      content="Review and analyse the media and culture that you consume.">
<meta name="keywords" content="Media tracker, reviews, metacritic">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="X-UA-Compatible" content="ie=edge" />
<link rel="icon"
      type="image/png"
      href="{% static 'images/bookshelf.png' %}" />
<link rel="manifest" href="{% static 'manifest.json' %}" />
<meta name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff" />
<meta name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f172a" />
{# Apply the stored theme before the first paint, to avoid a flash of the system theme #}
<script>
  try {
    const theme = localStorage.getItem("theme");
    if (theme) document.documentElement.dataset.theme = theme;
  } catch (e) {}
</script>
{% tailwind_css %}
{% htmx_script %}
