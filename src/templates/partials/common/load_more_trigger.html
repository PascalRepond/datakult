{% load i18n %}
{% load media_tags %}
{# This partial creates a "Load more" trigger that uses HTMX infinite scroll #}
{% if page_obj.has_next %}
  <div hx-get="{% url 'load_more_media' %}?{% query_string request page=page_obj.next_page_number %}"
       hx-trigger="revealed"
       hx-swap="outerHTML"
       class="col-span-full flex justify-center py-4">
    {% include "partials/common/spinner.html" with size="lg" show_text=True inline=True %}
  </div>
{% endif %}
