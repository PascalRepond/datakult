{% load i18n %}
{# Back link to the parent page. Parameters: url #}
{# Leading to the list, it goes back in history instead when coming from the list or the stats (see base.js), #}
{# to find that page as it was left (filters, scroll position) #}
<a href="{{ url }}"
   class="btn btn-ghost btn-sm btn-circle shrink-0"
   aria-label="{% translate 'Back' %}"
   {% if url == list_url %}data-history-back="{% url 'home' %} {% url 'stats' %}"{% endif %}>
  {% lucide "arrow-left" %}
</a>
