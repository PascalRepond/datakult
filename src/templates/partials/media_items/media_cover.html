{% load media_tags %}
<div class="relative w-24 h-32 bg-base-300 rounded overflow-hidden hover:opacity-90 transition-opacity">
  {% include "partials/media_items/cover_image.html" with placeholder_class="w-12 h-12" %}
  <span class="absolute top-1 left-1 badge badge-sm bg-base-100/80 backdrop-blur-sm border-0 px-1"
        role="img"
        aria-label="{{ media.get_media_type_display }}">{% media_icon media.media_type size="sm" %}</span>
</div>
