{% load i18n %}
{% load media_tags %}
{# Inner template of media_score_ring.html: a grey track under the score arc, the score in their neutral centre, #}
{# and with its verdict, a pill tinted with the colour of the score #}
<span class="inline-flex items-center gap-2 {% if show_label != False %}{{ score|score_color }} bg-current/10 rounded-full pr-3 w-fit{% endif %} {{ extra_class }}">
  <span class="inline-grid *:[grid-area:1/1] font-bold text-base-content bg-base-100 rounded-full {{ number_class }}"
        role="meter"
        aria-valuemin="0"
        aria-valuemax="10"
        aria-valuenow="{{ score }}"
        aria-label="{% blocktranslate %}Score: {{ score }} out of 10{% endblocktranslate %}">
    <span class="radial-progress text-base-content/15"
          style="--value:100; {{ ring_style }}"
          aria-hidden="true"></span>
    <span class="radial-progress {{ score|score_color }}"
          style="--value:{% widthratio score 1 10 %}; {{ ring_style }}"
          aria-hidden="true"></span>
    <span class="place-self-center" aria-hidden="true">{{ score }}</span>
  </span>
  {% if show_label != False %}<span class="{{ label_class }} font-medium text-base-content">{{ label }}</span>{% endif %}
</span>
